name: vsb-microservices

networks:
  vsb-net:
    driver: bridge

volumes:
  redpanda-data:

services:
  # --- Event bus ---
  redpanda:
    image: redpandadata/redpanda:v26.2.2
    container_name: vsb-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "19092:19092" # Kafka API (host access)
      - "18081:18081" # Schema registry
      - "18082:18082" # HTTP proxy
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks: [vsb-net]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-console:
    image: redpandadata/console:v3.11.0
    container_name: vsb-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080" # topic inspector UI: http://localhost:8080
    depends_on:
      redpanda:
        condition: service_healthy
    networks: [vsb-net]

  # --- Datastores ---
  # No local Mongo or Redis container — every service connects to managed
  # MongoDB Atlas / Redis Cloud (MONGO_URI / REDIS_HOST etc. in the root
  # .env, gitignored), same as production already does. Atlas is always a
  # replica set, which is what @vsb/event-bus's outbox pattern needs
  # (transactions + change streams) — see
  # docs/architecture-decision-records/0007-mongodb-atlas-not-self-hosted.md
  # and 0006-redis-cloud-per-service-ownership.md.

  # --- Observability ---
  # Jaeger v2 (built on the OpenTelemetry Collector core) — receives OTLP
  # traces directly, no config file needed for all-in-one mode. Every
  # service points OTEL_EXPORTER_OTLP_ENDPOINT here (base URL — the OTLP
  # exporter appends /v1/traces itself) and loads instrumentation via
  # NODE_OPTIONS="--require @opentelemetry/auto-instrumentations-node/register"
  # rather than an in-app import — see
  # docs/architecture-decision-records/0004-otel-preload-not-import.md.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: vsb-jaeger
    ports:
      - "16686:16686" # Jaeger UI: http://localhost:16686
      - "4318:4318" # OTLP HTTP receiver
    networks: [vsb-net]

  # --- Pilot services ---
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: vsb-api-gateway
    environment:
      NODE_ENV: development
      PORT: 3000
      PROMOTIONS_SERVICE_URL: http://promotions-service:3001
      ANALYTICS_SERVICE_URL: http://analytics-service:3003
      AUTH_SERVICE_URL: http://auth-service:3004
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: api-gateway
      NODE_OPTIONS: --require @opentelemetry/auto-instrumentations-node/register
    ports:
      - "3000:3000"
    depends_on:
      - promotions-service
      - analytics-service
      - auth-service
      - jaeger
    networks: [vsb-net]

  promotions-service:
    build:
      context: ..
      dockerfile: services/promotions-service/Dockerfile
    container_name: vsb-promotions-service
    environment:
      NODE_ENV: development
      PORT: 3001
      MONGO_URI: ${MONGO_URI}
      KAFKA_BROKERS: redpanda:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: promotions-service
      NODE_OPTIONS: --require @opentelemetry/auto-instrumentations-node/register
    ports:
      - "3001:3001"
    depends_on:
      redpanda:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks: [vsb-net]

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    container_name: vsb-notification-service
    environment:
      NODE_ENV: development
      PORT: 3002
      MONGO_URI: ${MONGO_URI}
      KAFKA_BROKERS: redpanda:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: notification-service
      NODE_OPTIONS: --require @opentelemetry/auto-instrumentations-node/register
    ports:
      - "3002:3002"
    depends_on:
      redpanda:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks: [vsb-net]

  analytics-service:
    build:
      context: ..
      dockerfile: services/analytics-service/Dockerfile
    container_name: vsb-analytics-service
    environment:
      NODE_ENV: development
      PORT: 3003
      MONGO_URI: ${MONGO_URI}
      KAFKA_BROKERS: redpanda:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: analytics-service
      NODE_OPTIONS: --require @opentelemetry/auto-instrumentations-node/register
    ports:
      - "3003:3003"
    depends_on:
      redpanda:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks: [vsb-net]

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    container_name: vsb-auth-service
    environment:
      NODE_ENV: development
      PORT: 3004
      MONGO_URI: ${MONGO_URI}
      KAFKA_BROKERS: redpanda:9092
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      # Redis Cloud — matches production's approach (see ADR 0006), not a
      # local container. Set these in a root .env (gitignored); the
      # service falls back to an unauthenticated localhost Redis if unset.
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: auth-service
      NODE_OPTIONS: --require @opentelemetry/auto-instrumentations-node/register
    ports:
      - "3004:3004"
    depends_on:
      redpanda:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks: [vsb-net]
